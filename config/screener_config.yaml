# screener_config.yaml
# All the thresholds for the screener. Analysts can edit the numbers here.
#
# How the filter names work:
#   xxx_min = the value must be AT LEAST this number
#   xxx_max = the value must be AT MOST this number
# (so "de_max: 0" means debt free, and "fcf_min: 0" means free cash flow of zero or more)
#
# Filters that work on any preset (15 main ones):
#   roe_min, de_max, fcf_min, revenue_cagr_5yr_min, pat_cagr_5yr_min, opm_min,
#   pe_max, pb_max, dividend_yield_min, icr_min, market_cap_min, net_profit_min,
#   eps_cagr_min, asset_turnover_min, sales_min
# Extra filters used by some presets:
#   dividend_payout_max, revenue_cagr_3yr_min, fcf_positive_latest, de_declining
#
# Units: sales, net profit, FCF and market cap are in Crore. Percent values are plain numbers (15 = 15%).
# Banks/NBFCs/insurance (sector "Financials") are skipped by the D/E filters,
# because high debt is normal for them.

presets:
  quality_compounder:
    title: Quality Compounder
    filters:
      roe_min: 15
      de_max: 1.0
      fcf_min: 0
      revenue_cagr_5yr_min: 10

  value_pick:
    title: Value Pick
    filters:
      # the plan says P/E < 20 and P/B < 3, but on our data only 2 companies pass that
      # (median P/E is about 46, median P/B about 7.5). Loosened so the preset returns 5 or more.
      pe_max: 30
      pb_max: 5.0
      de_max: 2.0
      dividend_yield_min: 1

  growth_accelerator:
    title: Growth Accelerator
    filters:
      pat_cagr_5yr_min: 20
      revenue_cagr_5yr_min: 15
      de_max: 2.0

  dividend_champion:
    title: Dividend Champion
    filters:
      dividend_yield_min: 2
      dividend_payout_max: 80
      fcf_min: 0

  debt_free_blue_chip:
    title: Debt-Free Blue Chip
    # banks always carry debt, so they can't be "debt free" - leave them out of this one
    exclude_sectors: [Financials]
    filters:
      # the plan says D/E = 0, but no company in our data has exactly 0 (all show a little borrowing).
      # So "debt free" here means D/E of 0.1 or less.
      de_max: 0.1
      roe_min: 12
      sales_min: 5000

  turnaround_watch:
    title: Turnaround Watch
    filters:
      revenue_cagr_3yr_min: 10
      fcf_positive_latest: true
      de_declining: true

# Composite quality score (0 to 100). The weights add up to 100.
composite_weights:
  return_on_equity_pct: 15
  return_on_capital_employed_pct: 10
  net_profit_margin_pct: 10
  fcf_cagr_5yr: 15
  cfo_quality_score: 10
  fcf_positive: 5
  revenue_cagr_5yr: 10
  pat_cagr_5yr: 10
  debt_to_equity: 10
  interest_coverage: 5

# winsorising: values below the 10th and above the 90th percentile are capped
winsor_low: 0.10
winsor_high: 0.90

# a sector needs at least this many companies to be scored against its own peers
min_sector_size: 5
